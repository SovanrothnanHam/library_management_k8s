apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: library-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: ourlibrary.com
      http:
        paths:
          - path: /register
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 3000
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 3000
          - path: /librarian
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 3000
          - path: /member
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 3000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: gateway-service
                port:
                  number: 3000
          - path: /logs
            pathType: Prefix
            backend:
              service:
                name: log-viewer-service
                port:
                  number: 80
