apiVersion: apps/v1
kind: Deployment
metadata:
  name: librarian
  labels:
    app: librarian
    part-of: library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librarian
  template:
    metadata:
      labels:
        app: librarian
        part-of: library
    spec:
      containers:
        - name: librarian-container
          image: rothnan/lib-k8s-librarian:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: library-secret
                  key: MONGO_URI
            - name: GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: library-secret
                  key: GATEWAY_SECRET
          readinessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
