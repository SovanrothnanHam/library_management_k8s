apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration
  labels:
    app: registration
    part-of: library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registration
  template:
    metadata:
      labels:
        app: registration
        part-of: library
    spec:
      containers:
        - name: registration-container
          image: rothnan/lib-k8s-registration:1.1      
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: library-secret
                  key: MONGO_URI
            - name: GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: library-secret
                  key: GATEWAY_SECRET
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
